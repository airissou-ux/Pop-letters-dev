<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Test fetch dictionnaire</title>
</head>
<body style="font-family:monospace;padding:20px;background:#111;color:#0f0;">
<h1>Test isolé : fetch du dictionnaire</h1>
<div id="log">Démarrage...</div>
<script>
const log = document.getElementById("log");
function addLog(msg) {
  log.innerHTML += "<br>" + new Date().toLocaleTimeString() + " — " + msg;
}

addLog("Script démarré");
addLog("URL testée: dico-fr-5-10.txt");

fetch("dico-fr-5-10.txt")
  .then(resp => {
    addLog("Réponse reçue ! Status: " + resp.status);
    return resp.text();
  })
  .then(text => {
    addLog("Texte récupéré ! Longueur: " + text.length + " caractères");
    addLog("Nombre de lignes: " + text.split("\n").length);
    addLog("Premiers 100 caractères: " + text.substring(0, 100));
  })
  .catch(err => {
    addLog("ERREUR: " + err.message);
  });

// Timeout de sécurité pour voir si ça traîne
setTimeout(() => {
  addLog("--- 5 secondes écoulées ---");
}, 5000);
setTimeout(() => {
  addLog("--- 15 secondes écoulées ---");
}, 15000);
setTimeout(() => {
  addLog("--- 30 secondes écoulées ---");
}, 30000);
</script>
</body>
</html>
